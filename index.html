<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9F2D9">
<title>Speaking Coach</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
:root{--bg:#E9F2D9;--glow:radial-gradient(900px 480px at 100% -8%,rgba(255,255,255,.7),transparent 62%);--sf:#F8FBF1;--tx:#27361F;--mu:#5B6B4C;--ac:#4C7A34;--ac2:#6FA04A;--on:#fff;--wn:#B9772A;--wb:#FBF1DA;--ln:#CBDDB2;--me:#3F6B2C;--mt:#fff;--sh:0 2px 10px rgba(60,90,40,.13);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141C16;--glow:none;--sf:#1F2C23;--tx:#E6F0DB;--mu:#A5B79A;--ac:#8CC463;--ac2:#6FA04A;--on:#10200A;--wn:#E3B068;--wb:#2C2517;--ln:#2F4234;--me:#3E6A45;--sh:0 2px 10px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#141C16;--glow:none;--sf:#1F2C23;--tx:#E6F0DB;--mu:#A5B79A;--ac:#8CC463;--ac2:#6FA04A;--on:#10200A;--wn:#E3B068;--wb:#2C2517;--ln:#2F4234;--me:#3E6A45;--sh:0 2px 10px rgba(0,0,0,.35)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--glow),var(--bg);color:var(--tx);font:16px/1.6 Vazirmatn,system-ui,Tahoma,sans-serif}
[hidden]{display:none!important}
select,button,input{font:inherit;color:inherit}
select,.ghost{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:6px 10px;cursor:pointer}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(145deg,var(--ac),color-mix(in srgb,var(--ac) 80%,#000));color:var(--on);display:grid;place-items:center;box-shadow:var(--sh);flex:none}
h1{margin:0;font-size:19px;font-weight:700;white-space:nowrap;direction:ltr}
.tools{display:flex;gap:8px}
.ibtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);box-shadow:var(--sh);font-size:18px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.badge{position:absolute;top:-6px;inset-inline-end:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--ac);color:var(--on);font:700 11px/19px Vazirmatn,system-ui,sans-serif;font-style:normal;text-align:center;padding:0 5px}
.bar2{display:flex;flex-wrap:wrap;gap:8px;padding:4px 14px 6px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--ln);border-radius:999px;padding:4px 12px;font-size:14px;cursor:pointer;box-shadow:var(--sh);color:var(--tx)}
.chip span{color:var(--mu);font-size:12px}
.chip select{border:0;background:transparent;padding:2px 0;font-size:14px;cursor:pointer;color:inherit;border-radius:0}
.chip.pri{background:linear-gradient(145deg,var(--ac),color-mix(in srgb,var(--ac) 80%,#000));color:var(--on);border-color:transparent;font-weight:700}
.crow{padding:0 14px 6px}
#ctitle{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;unicode-bidi:plaintext;border-radius:999px}
#start{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:20px 24px;max-width:520px;margin:auto;text-align:center}
.hero{display:flex;justify-content:center;margin-bottom:4px}
.wave rect{fill:var(--ac);transform-box:fill-box;transform-origin:center;animation:wv 1.4s ease-in-out infinite}
.wave rect:nth-child(2){animation-delay:.15s;fill:var(--ac2)}
.wave rect:nth-child(3){animation-delay:.3s}
.wave rect:nth-child(4){animation-delay:.45s;fill:var(--ac2)}
.wave rect:nth-child(5){animation-delay:.6s}
@keyframes wv{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
@media (prefers-reduced-motion:reduce){.wave rect{animation:none}}
#start h2{font-size:32px;line-height:1.3;margin:0;direction:ltr}
#start p{margin:0;color:var(--mu)}
.big{background:linear-gradient(145deg,var(--ac),color-mix(in srgb,var(--ac) 80%,#000));color:var(--on);border:0;border-radius:16px;padding:14px;font-weight:700;font-size:18px;cursor:pointer;box-shadow:var(--sh)}
#log{flex:1;overflow-y:auto;direction:ltr;display:flex;flex-direction:column;padding:8px 14px}
.b{max-width:86%;padding:10px 14px;border-radius:20px;margin:5px 0;line-height:1.5;overflow-wrap:anywhere;box-shadow:var(--sh)}
.c{align-self:flex-start;background:var(--sf);border:1px solid var(--ln);border-bottom-left-radius:6px}
.me{align-self:flex-end;background:linear-gradient(145deg,var(--me),color-mix(in srgb,var(--me) 78%,#000));color:var(--mt);border-bottom-right-radius:6px}
.fix,.ok{align-self:flex-end;max-width:92%;margin:2px 0 8px;font-size:15px}
.fix{background:var(--wb);border-left:4px solid var(--wn);border-radius:14px;padding:8px 12px}
.ok{direction:rtl;color:var(--mu);padding:0 4px}
.fix s{display:block;color:var(--mu)}
.fix b{display:block}
.fa{direction:rtl;text-align:right;margin-top:4px;color:var(--mu)}
.ear{background:none;border:0;cursor:pointer;padding:0 4px;font-size:16px}
#fix.snd,.snd{background:var(--sf);border:1px solid var(--ln);border-left:4px solid var(--ac)}
.b .fa{border-top:1px dashed var(--ln);margin-top:6px;padding-top:6px;font-weight:400;cursor:pointer}
.fix b .fa{font-weight:400}
#hist,#rev,#rep{position:fixed;inset:0;z-index:10;background:var(--glow),var(--bg);overflow-y:auto;padding:calc(10px + env(safe-area-inset-top,0px)) 14px calc(14px + env(safe-area-inset-bottom,0px))}
.hhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hrow{display:flex;align-items:center;gap:6px;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:8px 10px;margin-bottom:8px;box-shadow:var(--sh)}
.htitle{flex:1;text-align:start;background:none;border:0;cursor:pointer;padding:4px;font-weight:700;unicode-bidi:plaintext}
.hmeta{display:block;font-weight:400;font-size:12px;color:var(--mu)}
.rcard{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;text-align:center;box-shadow:var(--sh)}
.ren{font-size:30px;font-weight:700;direction:ltr;margin:18px 0}
.rline{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.row2{display:flex;gap:8px;justify-content:center;margin-top:12px}
#dock{padding:10px 14px 14px;background:var(--sf);border-radius:24px 24px 0 0;box-shadow:0 -6px 18px rgba(60,90,40,.12);display:flex;flex-direction:column;align-items:center;gap:8px}
#prog{width:100%;max-width:520px;height:8px;border-radius:4px;background:var(--ln);overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:4px;transition:width .4s}
#goal{font-size:13px;color:var(--mu)}
#status{min-height:24px;font-size:14px;color:var(--mu);text-align:center;unicode-bidi:plaintext}
#mic{width:74px;height:74px;border-radius:50%;border:0;background:linear-gradient(145deg,var(--ac),color-mix(in srgb,var(--ac) 80%,#000));color:var(--on);cursor:pointer;display:grid;place-items:center;box-shadow:0 6px 16px rgba(60,90,40,.35)}
#mic:disabled{opacity:.45;cursor:default}
#mic.on{animation:p 1.2s infinite}
@keyframes p{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 55%,transparent)}to{box-shadow:0 0 0 24px transparent}}
@media (prefers-reduced-motion:reduce){#mic.on{animation:none;outline:4px solid var(--tx)}}
#hf{border-radius:999px;font-size:14px;padding:5px 14px}
#hf[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:transparent}
.row{display:flex;gap:8px;width:100%;max-width:520px}
.row input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--ln);border-radius:999px;padding:9px 16px;direction:ltr}
.row .ghost{border-radius:999px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
    <h1>Speaking Coach</h1>
  </div>
  <div class="tools">
    <button class="ibtn" id="hb" aria-label="History">🕘</button>
    <button class="ibtn" id="revb" aria-label="Review">📘<i class="badge" id="revn" hidden></i></button>
    <button class="ibtn" id="repb" aria-label="Report">📊</button>
    <button class="ibtn" id="cfg" aria-label="Setup">⚙</button>
  </div>
</header>
<div class="bar2">
  <label class="chip"><span>سطح</span>
    <select id="level" aria-label="سطح">
      <option value="A2">A2 مقدماتی</option>
      <option value="B1">B1 متوسط</option>
      <option value="B2">B2 بالاتر</option>
    </select>
  </label>
  <label class="chip"><span>موضوع</span>
    <select id="focus" aria-label="موضوع">
      <option value="auto">خودکار</option>
      <option value="general">عمومی</option>
      <option value="ielts">آیلتس</option>
      <option value="mech">مهندسی مکانیک</option>
    </select>
  </label>
  <button class="chip pri" id="chal">🎯 چالش امروز</button>
  <button class="chip" id="reset" hidden>＋ گفتگوی تازه</button>
</div>
<div class="crow"><button class="ghost" id="ctitle" hidden></button></div>

<section id="start">
  <div class="hero" aria-hidden="true">
    <svg class="wave" width="150" height="76" viewBox="0 0 150 76"><rect x="10" y="20" width="16" height="36" rx="8"/><rect x="38" y="8" width="16" height="60" rx="8"/><rect x="66" y="2" width="16" height="72" rx="8"/><rect x="94" y="12" width="16" height="52" rx="8"/><rect x="122" y="22" width="16" height="32" rx="8"/></svg>
  </div>
  <h2>Let's talk!</h2>
  <p>لازم نیست کامل حرف بزنی؛ فقط حرف بزن. من سؤال می‌پرسم، تو با صدا جواب می‌دهی و من همان لحظه غلط‌های گرامر و تلفظت را با توضیح فارسی نشان می‌دهم.</p>
  <button class="big" id="go">شروع مکالمه</button>
  <button class="ghost" id="hc" hidden></button>
  <button class="ghost" id="hs" hidden>گفتگوهای قبلی</button>
  <p id="note">هدف امروز: ۱۰ دقیقه حرف زدن. اگر چیزی به ذهنت نرسید، دکمهٔ 💡 کمکت می‌کند.</p>
</section>

<div id="log" hidden aria-live="polite"></div>

<footer id="dock" hidden>
  <div id="prog"><div id="bar"></div></div>
  <div id="goal"></div>
  <div id="status"></div>
  <button id="mic" aria-label="Speak">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <button class="ghost" id="hf" aria-pressed="false">دست‌آزاد: خاموش</button>
  <div class="row">
    <input id="txt" dir="ltr" placeholder="Or type here" autocomplete="off">
    <button class="ghost" id="hint" aria-label="Hint">💡</button>
    <button class="ghost" id="send">ارسال</button>
  </div>
</footer>

<div id="hist" hidden>
  <div class="hhead"><b>گفتگوهای قبلی</b><button class="ghost" id="hx" aria-label="Close">✕</button></div>
  <div id="syncst" class="ok"></div>
  <div id="wk" class="ok"></div>
  <div id="hlist"></div>
</div>

<div id="rev" hidden>
  <div class="hhead"><b>مرور واژه‌ها</b><button class="ghost" id="rx" aria-label="Close">✕</button></div>
  <div id="rbody"></div>
</div>
<div id="rep" hidden>
  <div class="hhead"><b>گزارش هفتگی</b><button class="ghost" id="px" aria-label="Close">✕</button></div>
  <div id="pbody"></div>
</div>

<script>
const $=s=>document.querySelector(s),log=$('#log'),st=$('#status'),mic=$('#mic'),txt=$('#txt'),lv=$('#level');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let sample=null,hist=[],busy=false,rec=null,listening=false,heard='';
try{lv.value=localStorage.getItem('lvl')||'B1'}catch(e){}
lv.onchange=()=>{try{localStorage.setItem('lvl',lv.value)}catch(e){}};
const say=t=>{st.textContent=t};
const cancel=()=>stopVoice();

function el(c,t,p){const d=document.createElement('div');d.className=c;if(t)d.textContent=t;(p||log).appendChild(d);log.scrollTop=log.scrollHeight;return d}
function ear(p,t){const b=document.createElement('button');b.className='ear';b.textContent='🔊';b.dataset.say=t;b.setAttribute('aria-label','Listen');p.appendChild(b)}
function tr(p,t){
  const b=document.createElement('button');b.className='ear';b.textContent='🌐';b.dataset.tr='1';b.setAttribute('aria-label','ترجمه');
  const f=document.createElement('div');f.className='fa';f.dataset.t='1';f.textContent=t;f.hidden=true;
  p.appendChild(b);p.appendChild(f);
}

let cur=null;
const chats=()=>jget('chats',[]);
function makeChat(){return{id:Date.now().toString(36),title:'گفتگوی جدید',created:Date.now(),updated:Date.now(),hist:[],html:'',level:lv.value,named:false}}
function putChats(a){
  a.sort((x,y)=>y.updated-x.updated);
  while(a.length>120)a.pop();
  for(;;){try{localStorage.setItem('chats',JSON.stringify(a));return}catch(e){if(a.length<2)return;a.pop()}}
}
function setTitle(){const t=$('#ctitle');t.hidden=!cur;if(cur)t.textContent=cur.title+' ✏️'}
function saveChat(){
  try{
    if(!cur)return;
    cur.hist=hist.slice(-60);cur.html=log.innerHTML;cur.compact=false;cur.level=lv.value;cur.updated=Date.now();
    if(!cur.named){const u=hist.find(m=>m.r==='u'&&m.t);if(u)cur.title=u.t.slice(0,28)}
    const a=chats().filter(x=>x.id!==cur.id);a.push(cur);putChats(a);setTitle();
  }catch(e){}
}
function showHist(){renderHist();syncNow().then(()=>{if(!$('#hist').hidden)renderHist()})}
function renderHist(){
  const box=$('#hlist');box.textContent='';$('#wk').textContent='۷ روز اخیر: '+weekBars();
  const a=chats();
  if(!a.length)el('ok','هنوز گفتگویی ذخیره نشده است.',box);
  a.forEach(c=>{
    const row=document.createElement('div');row.className='hrow';
    const t=document.createElement('button');t.className='htitle';t.dataset.open=c.id;t.textContent=c.title;
    const m=document.createElement('span');m.className='hmeta';
    m.textContent=new Date(c.updated).toLocaleDateString('fa-IR')+' — '+Math.ceil((c.hist||[]).length/2)+' نوبت';
    t.appendChild(m);
    const r=document.createElement('button');r.className='ear';r.textContent='✏️';r.dataset.ren=c.id;r.setAttribute('aria-label','Rename');
    const d=document.createElement('button');d.className='ear';d.textContent='🗑';d.dataset.del=c.id;d.setAttribute('aria-label','Delete');
    row.append(t,r,d);box.appendChild(row);
  });
  $('#hist').hidden=false;
}
function openChat(c){
  if(busy)return;
  if(!api&&!setApi())return;
  stopVoice();if(rc)giveUp();
  if(window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  if(!AC){initAudio();warmMic()}
  cur=c;hist=(c.hist||[]).slice();if(c.html)log.innerHTML=c.html;else rebuild(c);
  log.querySelectorAll('[data-play]').forEach(x=>x.remove());
  lv.value=c.level||lv.value;
  $('#start').hidden=true;log.hidden=false;$('#dock').hidden=false;$('#reset').hidden=false;
  $('#hist').hidden=true;setTitle();showGoal();
  log.scrollTop=log.scrollHeight;
  say('ادامهٔ گفتگو. هر وقت آماده‌ای حرف بزن یا 💡 را بزن.');
}
function fixCard(x){
  const f=el('fix'),a=document.createElement('s'),b=document.createElement('b');
  a.textContent=String(x.said);f.appendChild(a);
  b.textContent='✓ '+x.better;ear(b,String(x.better));f.appendChild(b);
  el('fa',x.fa,f);
}

function soundCard(x){
  const f=el('fix snd'),b=document.createElement('b');
  b.textContent='🗣 '+x.word+(x.say?'  →  '+x.say:'');ear(b,String(x.word));f.appendChild(b);
  el('fa',x.fa,f);
}

let AC=null,MS=null,SRC=null,PROC=null,rc=null,starting=false,hands=false,tts=true,vt=0,spk=null;
async function initAudio(){
  if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended')await AC.resume();
}
async function warmMic(){
  try{const m=await navigator.mediaDevices.getUserMedia({audio:true});m.getTracks().forEach(t=>t.stop())}
  catch(e){say('اجازهٔ میکروفون داده نشده؛ فعلاً می‌توانی تایپ کنی.')}
}
function release(){
  try{PROC.onaudioprocess=null;PROC.disconnect();SRC.disconnect();MS.getTracks().forEach(t=>t.stop())}catch(e){}
  PROC=SRC=MS=null;
}
function onChunk(e){
  if(!rc)return;
  const d=e.inputBuffer.getChannelData(0);
  rc.chunks.push(new Float32Array(d));
  let q=0;for(let i=0;i<d.length;i++)q+=d[i]*d[i];
  const rms=Math.sqrt(q/d.length),dt=d.length/AC.sampleRate;
  rc.t+=dt;
  if(rc.t<0.4){rc.noise=Math.max(rc.noise,rms);return}
  const thr=Math.min(0.08,Math.max(0.02,rc.noise*3));
  if(rms>thr){rc.voiced+=dt;rc.quiet=0;if(rc.voiced>0.25)rc.spoke=true}else rc.quiet+=dt;
  if(hands&&rc.spoke&&rc.quiet>2.4)finish();
  else if(hands&&!rc.spoke&&rc.t>14)giveUp();
}
function tick(){
  if(!rc)return;const n=Math.floor(rc.t);
  say(hands&&!rc.spoke?'دارم گوش می‌دهم… هر وقت آماده‌ای شروع کن':'در حال ضبط: '+n+' ثانیه'+(n<10?' — ادامه بده…':n<25?' — خوب است، بیشتر بگو':' — عالی، ادامه بده!')+(hands?' (وقتی ساکت شوی خودم می‌فرستم)':' (برای پایان دوباره بزن)'));
}
async function startRec(){
  if(rc||starting)return;
  starting=true;
  try{
    await initAudio();
    MS=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
    SRC=AC.createMediaStreamSource(MS);PROC=AC.createScriptProcessor(4096,1,1);
    PROC.onaudioprocess=onChunk;SRC.connect(PROC);PROC.connect(AC.destination);
    rc={chunks:[],t:0,noise:0,voiced:0,quiet:0,spoke:false};
    mic.classList.add('on');
    rc.tick=setInterval(tick,300);
    rc.timer=setTimeout(finish,75000);
  }finally{starting=false}
}
function giveUp(){
  const r=rc;if(!r)return;rc=null;
  clearTimeout(r.timer);clearInterval(r.tick);mic.classList.remove('on');release();
  say('چیزی نشنیدم. هر وقت آماده بودی دکمه را بزن.');
}
async function finish(){
  const r=rc;if(!r)return;rc=null;
  clearTimeout(r.timer);clearInterval(r.tick);mic.classList.remove('on');release();
  const blob=toWav(r.chunks,AC.sampleRate);
  if(blob.secs<0.7||blob.peak<0.02){say('صدایی نشنیدم یا خیلی کوتاه بود؛ دوباره بزن.');return}
  const data=await new Promise(res=>{const f=new FileReader();f.onload=()=>res(f.result.split(',')[1]);f.readAsDataURL(blob)});
  stopVoice();
  turn('',{data,secs:blob.secs,bubble:el('b me','…'),url:URL.createObjectURL(blob)});
}
function toWav(chunks,rate){
  let n=0;chunks.forEach(c=>n+=c.length);
  const all=new Float32Array(n);let o=0;chunks.forEach(c=>{all.set(c,o);o+=c.length});
  const R=16000,k=rate/R,len=Math.floor(n/k),pcm=new Int16Array(len);let peak=0;
  for(let i=0;i<len;i++){
    const a=Math.floor(i*k),b=Math.max(a+1,Math.min(n,Math.floor((i+1)*k)));let s=0;
    for(let j=a;j<b;j++)s+=all[j];
    const v=Math.max(-1,Math.min(1,s/(b-a)));peak=Math.max(peak,Math.abs(v));pcm[i]=v<0?v*32768:v*32767;
  }

    st.textContent='همگام‌سازی فعال ✓';
  }catch(e){
    st.textContent=e.message==='no_pass_set'?'همگام‌سازی خاموش است: در Script properties مقدار SYNC_PASS را بگذار.':(e.message==='needpass'||e.message==='badpass')?'برای همگام‌سازی رمز لازم است: دکمهٔ ⚙ را بزن.':'همگام‌سازی نشد؛ بعداً دوباره تلاش می‌شود.';
  }
  syncing=false;
}

async function startChallenge(){
  if(busy)return;
  if(!api&&!setApi())return;
  if(window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  if(!AC){initAudio();warmMic()}
  $('#start').hidden=true;log.hidden=false;$('#dock').hidden=false;$('#reset').hidden=false;
  let c=jget('chal',null);
  if(!c||c.d!==ago(0)||c.level!==lv.value){
    busy=true;mic.disabled=true;say('دارم چالش امروز را می‌سازم…');
    try{
      const j=await call({level:lv.value,challenge:true,weak:jget('weak',[]).slice(-6),areas:areas()});
      c=Object.assign({d:ago(0),level:lv.value},j.challenge);jset('chal',c);addVocab(c.words);
    }catch(e){busy=false;mic.disabled=false;say(errMsg(e));return}
    busy=false;mic.disabled=false;
  }
  stopVoice();if(rc)giveUp();
  cur=makeChat();cur.title='🎯 '+(c.title||'چالش امروز');cur.named=true;hist=[];log.textContent='';
  setTitle();showGoal();chalCard(c);
  turn(null,null,c);
}

async function hint(){
  if(busy||!hist.length)return;
  busy=true;mic.disabled=true;say('دارم چند جملهٔ کمکی پیدا می‌کنم…');
  try{
    const j=await call({level:lv.value,hint:true,hist:hist.slice(-12)});
    const f=el('fix snd');
    (j.hints||[]).slice(0,3).forEach(h=>{const en=typeof h==='string'?h:h.en,fa=typeof h==='string'?'':h.fa;const b=document.createElement('b');b.textContent='“'+en+'”';ear(b,String(en));if(fa)tr(b,fa);f.appendChild(b)});
    el('fa','یکی را بلند بگو، یا با حرف خودت جواب بده.',f);
    say('نوبت توست: دکمه را بزن');
  }catch(e){say(errMsg(e))}
  busy=false;mic.disabled=false;
}

async function turn(u,a,ch){
  if(!cur)cur=makeChat();
  busy=true;mic.disabled=true;say('مربی در حال '+(a?'گوش دادن و ':'')+'فکر کردن است…');
  let reply='';
  try{
    const j=await call({level:lv.value,start:u===null,starter:(u===null&&!ch)?starter():'',chal:ch?{task:ch.task,words:ch.words}:undefined,hist:hist.slice(-12),audio:a?a.data:undefined});
    if(a){
      a.bubble.textContent=j.heard||'(نامفهوم)';hist.push({r:'u',t:j.heard||''});addSecs(a.secs);
      const p=document.createElement('button');p.className='ear';p.dataset.play='1';p.textContent='▶';p.setAttribute('aria-label','Play my voice');
      p.onclick=()=>new Audio(a.url).play();a.bubble.appendChild(p);
    }
    if(u!==null){
      const fx=Array.isArray(j.fixes)?j.fixes:[],sn=Array.isArray(j.sounds)?j.sounds:[];
      fx.forEach(fixCard);sn.forEach(soundCard);
      if(!fx.length&&!sn.length)el('ok',a?'✓ جمله و تلفظت خوب بود':'✓ جمله‌ات درست بود');
      if(j.tip)el('ok',j.tip);
      const nw=((a?j.heard:u)||'').split(/\s+/).filter(Boolean).length;keepWeak(fx);trackStats(nw,fx.length);logTurn(nw,fx,sn);
    }
    if(j.note){notes.push(String(j.note).slice(0,160));notes=notes.slice(-20);jset('notes',notes)}
    hist.push({r:'c',t:j.reply});
    const b=el('b c',j.reply);ear(b,j.reply);if(j.reply_fa)tr(b,j.reply_fa);
    if(Array.isArray(j.vocab)&&j.vocab.length){vocabCard(j.vocab);addVocab(j.vocab)}
    reply=j.reply;if(j.summary&&cur)cur.summary=String(j.summary).slice(0,240);saveChat();scheduleSync();
  }catch(e){
    if(a)a.bubble.textContent='— ارسال نشد؛ دوباره ضبط کن —';
    else if(u!==null&&u!==''){hist.pop();txt.value=u}
    say(errMsg(e));
  }
  busy=false;mic.disabled=false;
  if(reply)sayReply(reply);
}

function send(t){
  t=(t||'').trim();if(busy||!t)return;
  cancel();el('b me',t);hist.push({r:'u',t});txt.value='';turn(t);
}

mic.onclick=async()=>{
  if(rc){finish();return}
  if(busy)return;
  stopVoice();
  try{await startRec()}catch(e){say('اجازهٔ میکروفون داده نشده یا میکروفون پیدا نشد.')}
};
$('#hf').onclick=()=>{
  hands=!hands;$('#hf').textContent='دست‌آزاد: '+(hands?'روشن':'خاموش');$('#hf').setAttribute('aria-pressed',hands);
  if(hands&&!busy&&!rc&&!spk)startRec().catch(()=>{});
  if(!hands&&rc)giveUp();
};
$('#send').onclick=()=>send(txt.value);
txt.onkeydown=e=>{if(e.key==='Enter')send(txt.value)};
$('#reset').onclick=()=>{if(busy)return;stopVoice();if(rc)giveUp();cur=makeChat();hist=[];log.textContent='';setTitle();turn(null)};

const API_URL='https://script.google.com/macros/s/AKfycbwtXvQgX6a1mvnl64c31b8utu2mHlqoQtKwmxynC1RFbjPuN-ORyTR_0ekq7gt4ohnD/exec';
let api=API_URL;if(!api){try{api=localStorage.getItem('api')||''}catch(e){}}
function setApi(){
  const v=prompt('آدرس Apps Script (که به /exec ختم می‌شود) را اینجا بچسبان:',api);
  if(v&&v.trim()){api=v.trim();try{localStorage.setItem('api',api)}catch(e){}}
  return api;
}
$('#cfg').onclick=()=>{API_URL?setPass():setApi()};$('#cfg').hidden=false;
$('#hint').onclick=hint;
$('#go').onclick=async()=>{
  if(!api&&!setApi())return;
  if(window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(''));
  await initAudio();
  $('#start').hidden=true;log.hidden=false;$('#dock').hidden=false;$('#reset').hidden=false;
  cur=makeChat();hist=[];setTitle();showGoal();warmMic();turn(null);
};

log.addEventListener('click',e=>{
  const b=e.target.closest('button'),f=e.target.closest('.fa[data-t]');
  if(b&&b.dataset.lvl){lv.value=b.dataset.lvl;try{localStorage.setItem('lvl',b.dataset.lvl)}catch(x){}b.remove();return}
  if(b&&b.dataset.say!==undefined){speak(b.dataset.say);return}
  if(b&&b.dataset.tr!==undefined){const x=b.parentNode.querySelector(':scope > .fa[data-t]');if(x)x.hidden=!x.hidden;return}
  if(f)f.hidden=true;
});
$('#hlist').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.dataset.open||b.dataset.ren||b.dataset.del;if(!id)return;
  const a=chats(),c=a.find(x=>x.id===id);if(!c)return;
  if(b.dataset.open){openChat(c);return}
  if(b.dataset.ren){
    const v=prompt('اسم این گفتگو:',c.title);
    if(v&&v.trim()){c.title=v.trim().slice(0,60);c.named=true;c.updated=Date.now();scheduleSync();if(cur&&cur.id===c.id){cur.title=c.title;cur.named=true;setTitle()}putChats(a);showHist()}
    return;
  }
  if(b.dataset.del&&confirm('این گفتگو حذف شود؟')){
    putChats(a.filter(x=>x.id!==id));{const tb=jget('tomb',[]);tb.push({id,deleted:true,updated:Date.now()});jset('tomb',tb)}scheduleSync();
    if(cur&&cur.id===id){cur=null;hist=[];log.textContent='';setTitle();say('گفتگو حذف شد. برای شروع، «از نو» را بزن.')}
    showHist();updStart();
  }
});
$('#hb').onclick=showHist;$('#hs').onclick=showHist;$('#hx').onclick=()=>{$('#hist').hidden=true};
updStart();
$('#ctitle').onclick=()=>{
  if(!cur)return;
  const v=prompt('اسم این گفتگو:',cur.title);
  if(v&&v.trim()){cur.title=v.trim().slice(0,60);cur.named=true;saveChat()}
};
try{$('#focus').value=localStorage.getItem('focus')||'auto'}catch(e){}
$('#focus').onchange=()=>{try{localStorage.setItem('focus',$('#focus').value)}catch(e){}showGoal()};
$('#chal').onclick=startChallenge;
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')syncNow()});
setTimeout(syncNow,1500);
function updStart(){
  const a=chats();$('#hs').hidden=!a.length;
  const h=$('#hc');h.hidden=!a.length;if(a.length)h.textContent='ادامهٔ آخرین گفتگو: '+a[0].title;
}
$('#hc').onclick=()=>{const a=chats();if(a.length)openChat(a[0])};
updStart();
$('#revb').onclick=openRev;$('#rx').onclick=()=>{$('#rev').hidden=true};
$('#repb').onclick=showReport;$('#px').onclick=()=>{$('#rep').hidden=true};
compactLocal();updRev();
</script>
